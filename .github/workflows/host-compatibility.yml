name: Plugin checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Check JavaScript syntax
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check
      - name: Test plugin host routes
        run: |
          node tools/local-vault-host-test.mjs
          node tools/remote-access-native-test.mjs
